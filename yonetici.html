<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071923" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Yönetici paneli — QRHizmeti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#071923',teal:'#19C6B4',paper:'#F5F8F6',muted:'#73838A'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>*{box-sizing:border-box}body{font-family:Manrope,Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-[#EEF3F0] text-ink antialiased">
  <header class="sticky top-0 z-30 border-b border-white/10 bg-ink text-white"><div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6"><a href="index.html" class="flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-xl bg-teal text-xs font-black text-ink">QR</span><span class="font-extrabold">QR<span class="text-teal">Hizmeti</span> <span class="ml-1 text-white/55">· Yönetim</span></span></a><div class="flex items-center gap-3"><span id="admin-email" class="hidden max-w-48 truncate text-xs text-white/60 sm:inline"></span><a href="yonetim.html" class="rounded-full border border-white/15 px-3 py-2 text-xs font-bold">İşletme paneli</a><button id="logout" class="rounded-full bg-teal px-4 py-2 text-xs font-extrabold text-ink">Çıkış</button></div></div></header>
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <div class="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-[10px] font-extrabold uppercase tracking-[.18em] text-teal-800">QRHİZMETİ · DESTEK</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">İşletmeler ve QR onayları</h1><p class="mt-2 max-w-2xl text-sm leading-6 text-muted">Hesapları ve gönderilen menüleri incele. Onayladığın QR bağlantısı müşterilere açılır.</p></div><button id="refresh" class="w-fit rounded-full border border-ink/10 bg-white px-4 py-2.5 text-xs font-extrabold hover:border-teal">Listeyi yenile ↻</button></div>
    <div id="notice" class="mb-5 hidden rounded-2xl border border-red-200 bg-red-50 p-4 text-sm font-semibold text-red-800" role="alert"></div>
    <div class="mb-6 grid gap-3 sm:grid-cols-3"><article class="rounded-2xl bg-white p-5 shadow-sm"><p class="text-xs font-bold text-muted">İşletme hesabı</p><p id="stat-accounts" class="mt-2 text-3xl font-extrabold">—</p></article><article class="rounded-2xl bg-white p-5 shadow-sm"><p class="text-xs font-bold text-muted">Onay bekleyen QR</p><p id="stat-pending" class="mt-2 text-3xl font-extrabold text-amber-600">—</p></article><article class="rounded-2xl bg-white p-5 shadow-sm"><p class="text-xs font-bold text-muted">Aktif QR</p><p id="stat-approved" class="mt-2 text-3xl font-extrabold text-teal-800">—</p></article></div>
    <section class="rounded-3xl border border-ink/5 bg-white p-4 shadow-sm sm:p-6"><div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between"><div class="flex flex-wrap gap-2"><button class="filter-button rounded-full bg-ink px-4 py-2.5 text-xs font-extrabold text-white" data-filter="pending">Onay kuyruğu</button><button class="filter-button rounded-full bg-paper px-4 py-2.5 text-xs font-extrabold text-muted" data-filter="all">Tüm QR menüler</button><button class="filter-button rounded-full bg-paper px-4 py-2.5 text-xs font-extrabold text-muted" data-filter="accounts">Hesaplar</button></div><label class="block w-full lg:max-w-sm"><span class="sr-only">İşletme ara</span><input id="search" class="w-full rounded-xl border border-ink/10 bg-paper px-4 py-3 text-sm outline-none focus:border-teal" placeholder="İşletme veya e-posta ara…" /></label></div><div id="list-status" class="mt-5 text-xs text-muted" aria-live="polite">Hesaplar yükleniyor…</div><div id="results" class="mt-3 grid gap-3 lg:grid-cols-2"></div></section>
  </main>
  <div id="detail-overlay" class="fixed inset-0 z-40 hidden overflow-y-auto bg-ink/65 p-3 backdrop-blur-sm sm:p-6"><section class="mx-auto my-3 max-w-4xl overflow-hidden rounded-3xl bg-white shadow-2xl sm:my-8"><header class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-ink/5 bg-white/95 px-5 py-4 backdrop-blur sm:px-7"><div class="min-w-0"><p id="detail-owner" class="truncate text-[10px] font-bold uppercase tracking-wider text-teal-800"></p><h2 id="detail-title" class="mt-1 truncate text-xl font-extrabold">Menü detayı</h2></div><button id="close-detail" class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-paper text-lg font-bold" aria-label="Detayı kapat">×</button></header><div class="p-5 sm:p-7"><div id="detail-body" class="space-y-5"></div><div id="review-controls" class="mt-7 border-t border-ink/10 pt-5"><label class="block text-xs font-extrabold">İşletmeye not <span class="font-medium text-muted">(düzenleme isteyeceksen yaz)</span><textarea id="review-note" maxlength="500" rows="3" class="mt-2 w-full rounded-xl border border-ink/10 bg-paper px-4 py-3 text-sm outline-none focus:border-teal" placeholder="Örn. Ürün fiyatlarını ve işletme tanıtımını kontrol edip tekrar gönderin."></textarea></label><div class="mt-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button id="request-changes" class="rounded-xl border border-amber-300 bg-amber-50 px-5 py-3 text-xs font-extrabold text-amber-900 hover:bg-amber-100">Düzenleme iste</button><button id="approve-menu" class="rounded-xl bg-ink px-5 py-3 text-xs font-extrabold text-white transition hover:bg-teal hover:text-ink">Onayla ve QR'ı aktifleştir ✓</button></div><p id="review-status" class="mt-3 text-xs text-muted" aria-live="polite"></p></div></div></section></div>
  <script type="importmap">{"imports":{"@netlify/identity":"https://esm.sh/@netlify/identity@2.0.1?bundle"}}</script>
  <script type="module">
    import {getUser,logout,handleAuthCallback} from '@netlify/identity';
    await handleAuthCallback().catch(()=>{});
    const user=await getUser();
    if(!user){location.replace('hesap.html?next=yonetici.html');throw new Error('Yönetici hesabı ile giriş yap.');}
    const $=id=>document.getElementById(id), state={accounts:[],menus:[],filter:'pending',selectedId:null};
    $('admin-email').textContent=user.email||'';
    $('logout').addEventListener('click',async()=>{await logout();location.replace('hesap.html');});
    function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
    function showNotice(message){$('notice').textContent=message;$('notice').classList.remove('hidden');}
    function formatDate(value){if(!value)return 'Tarih yok';const date=new Date(value);return Number.isNaN(date.getTime())?'Tarih yok':date.toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'});}
    const statusLabels={pending:'Onay bekliyor',approved:'Aktif',changes_requested:'Düzenleme istendi'};
    function menuCard(menu){
      const card=node('article','flex flex-col justify-between gap-4 rounded-2xl border border-ink/5 bg-paper p-4 sm:flex-row sm:items-center');
      const copy=node('div','min-w-0 flex-1');
      const title=node('h3','truncate text-sm font-extrabold',menu.name);copy.append(title);
      copy.append(node('p','mt-1 truncate text-xs text-muted',`${menu.email||'E-posta bilgisi yok'}${menu.phone?' · '+menu.phone:''} · ${menu.productCount} kayıt · ${formatDate(menu.submittedAt)}`));
      const status=node('span','mt-2 inline-flex rounded-full px-2.5 py-1 text-[10px] font-extrabold '+(menu.status==='approved'?'bg-teal/10 text-teal-900':menu.status==='changes_requested'?'bg-amber-100 text-amber-900':'bg-ink/5 text-ink/70'),statusLabels[menu.status]||'Aktif');copy.append(status);
      const button=node('button','rounded-xl bg-white px-4 py-3 text-xs font-extrabold hover:bg-ink hover:text-white','Menüyü incele →');button.type='button';button.addEventListener('click',()=>openMenu(menu.id));card.append(copy,button);return card;
    }
    function render(){
      const results=$('results');results.replaceChildren();const query=$('search').value.trim().toLocaleLowerCase('tr');
      document.querySelectorAll('.filter-button').forEach(button=>{const active=button.dataset.filter===state.filter;button.className='filter-button rounded-full px-4 py-2.5 text-xs font-extrabold '+(active?'bg-ink text-white':'bg-paper text-muted');});
      $('stat-accounts').textContent=state.accounts.length;$('stat-pending').textContent=state.menus.filter(menu=>menu.status==='pending').length;$('stat-approved').textContent=state.menus.filter(menu=>menu.status==='approved').length;
      if(state.filter==='accounts'){
        const accounts=state.accounts.filter(account=>(account.email+' '+account.menus.map(menu=>menu.name).join(' ')).toLocaleLowerCase('tr').includes(query));
        $('list-status').textContent=accounts.length+' hesap';
        accounts.forEach(account=>{const card=node('article','rounded-2xl border border-ink/5 bg-white p-4');const top=node('div','flex flex-wrap items-center justify-between gap-2');top.append(node('h3','font-extrabold',account.email));top.append(node('span','rounded-full bg-paper px-2.5 py-1 text-[10px] font-bold text-muted',account.menus.length+' QR'));card.append(top,node('p','mt-1 text-[10px] text-muted','Kayıt: '+formatDate(account.createdAt)+' · Son giriş: '+formatDate(account.lastSeenAt)));const menuWrap=node('div','mt-3 space-y-2');account.menus.forEach(menu=>{const row=node('div','flex items-center justify-between gap-2 rounded-xl bg-paper px-3 py-2');row.append(node('span','min-w-0 truncate text-xs font-bold',menu.name));const button=node('button','shrink-0 text-[10px] font-extrabold text-teal-800 underline','Menüyü aç');button.type='button';button.addEventListener('click',()=>openMenu(menu.id));row.append(button);menuWrap.append(row);});if(!account.menus.length)menuWrap.append(node('p','text-xs text-muted','Henüz QR menüsü oluşturulmamış.'));card.append(menuWrap);results.append(card);});
      }else{
        const menus=state.menus.filter(menu=>(state.filter!=='pending'||menu.status==='pending')&&(menu.name+' '+menu.email).toLocaleLowerCase('tr').includes(query));
        $('list-status').textContent=menus.length+(state.filter==='pending'?' onay bekleyen menü':' menü');
        menus.forEach(menu=>results.append(menuCard(menu)));
      }
      if(!results.children.length)results.append(node('p','rounded-2xl border border-dashed border-ink/15 p-8 text-center text-sm text-muted',state.filter==='pending'?'Bekleyen menü yok.':'Aramana uygun kayıt bulunamadı.'));
    }
    async function load(){const button=$('refresh');button.disabled=true;$('list-status').textContent='Hesaplar ve QR menüler alınıyor…';$('notice').classList.add('hidden');try{const response=await fetch('/.netlify/functions/admin',{cache:'no-store',credentials:'same-origin'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Yönetim verileri alınamadı.');state.accounts=data.accounts||[];state.menus=data.menus||[];render();}catch(error){showNotice(error.message||'Yönetim verileri alınamadı.');$('list-status').textContent='Yükleme başarısız.';}finally{button.disabled=false;}}
    async function openMenu(id){state.selectedId=id;$('detail-overlay').classList.remove('hidden');$('detail-body').replaceChildren(node('p','text-sm text-muted','Menü ayrıntıları yükleniyor…'));$('review-status').textContent='';$('review-note').value='';try{const response=await fetch('/.netlify/functions/admin?id='+encodeURIComponent(id),{cache:'no-store',credentials:'same-origin'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Menü ayrıntısı alınamadı.');renderDetail(data.menu,data.record);}catch(error){$('detail-body').replaceChildren(node('p','text-sm text-red-700',error.message||'Menü ayrıntısı alınamadı.'));}}
    function renderDetail(menu,record){
      const data=record.data||{},body=$('detail-body');body.replaceChildren();$('detail-owner').textContent=menu.email||'Hesap bilgisi yok';$('detail-title').textContent=data.brand?.name||menu.name;$('review-controls').classList.toggle('hidden',menu.status==='approved');
      const summary=node('div','grid gap-3 sm:grid-cols-3');summary.append(node('div','rounded-xl bg-paper p-3 text-xs','Durum: '+(statusLabels[menu.status]||'Aktif')),node('div','rounded-xl bg-paper p-3 text-xs','Gönderim: '+formatDate(menu.submittedAt)));const qrLink=node('a','break-all rounded-xl bg-paper p-3 text-xs font-bold text-teal-900 underline','QR menü bağlantısını aç ↗');qrLink.href='menu.html?menu='+encodeURIComponent(menu.id);qrLink.target='_blank';qrLink.rel='noopener';summary.append(qrLink);body.append(summary);
      const intro=node('p','rounded-xl bg-paper p-4 text-sm leading-6',data.brand?.intro||'İşletme tanıtımı eklenmemiş.');body.append(intro);
      if(data.brand?.logo){const logo=node('img','h-20 w-20 rounded-2xl object-cover');logo.src=data.brand.logo;logo.alt='Marka logosu';body.append(logo);}
      if(Array.isArray(data.campaigns)&&data.campaigns.length){const campaigns=node('div','grid grid-cols-2 gap-2 sm:grid-cols-3');data.campaigns.forEach((item,index)=>{const image=node('img','aspect-video w-full rounded-xl object-cover');image.src=item.image;image.alt='Kampanya '+(index+1);campaigns.append(image);});body.append(node('h3','text-xs font-extrabold','Kampanyalar'),campaigns);}
      const products=node('div','space-y-3');(data.products||[]).forEach(product=>{const row=node('article','flex gap-3 rounded-2xl border border-ink/5 p-3');if(product.photo){const image=node('img','h-20 w-20 shrink-0 rounded-xl object-cover');image.src=product.photo;image.alt=product.name;row.append(image);}const copy=node('div','min-w-0 flex-1');copy.append(node('h4','text-sm font-extrabold',product.name));copy.append(node('p','mt-1 text-xs text-muted',`${product.category||'Kategori yok'} · ₺${product.price??'—'}${product.discountPercent?' · %'+product.discountPercent+' indirim':''}`));if(product.description)copy.append(node('p','mt-2 text-xs leading-5 text-ink/75',product.description));const extras=[product.weight&&product.weight+' g',product.calories&&product.calories+' kcal',product.allergens].filter(Boolean).join(' · ');if(extras)copy.append(node('p','mt-2 text-[10px] font-bold text-teal-900',extras));row.append(copy);products.append(row);});body.append(node('h3','text-sm font-extrabold','Menü içeriği · '+(data.products||[]).length+' kayıt'),products);
      if(menu.status==='changes_requested'&&menu.note)body.append(node('p','rounded-xl bg-amber-50 p-4 text-sm text-amber-900','Son inceleme notu: '+menu.note));
    }
    async function review(status){const id=state.selectedId;if(!id)return;const note=$('review-note').value.trim();if(status==='changes_requested'&&!note){$('review-status').textContent='Düzenleme isteği için işletmeye kısa bir not yaz.';return;}const button=status==='approved'?$('approve-menu'):$('request-changes');button.disabled=true;$('review-status').textContent='Kaydediliyor…';try{const response=await fetch('/.netlify/functions/admin?id='+encodeURIComponent(id),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,note})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'İnceleme kararı kaydedilemedi.');$('review-status').textContent=status==='approved'?'Onaylandı. QR bağlantısı artık aktif.':'Düzenleme isteği işletmeye kaydedildi.';$('detail-overlay').classList.add('hidden');await load();}catch(error){$('review-status').textContent=error.message||'Karar kaydedilemedi.';}finally{button.disabled=false;}}
    document.querySelectorAll('.filter-button').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;render();}));
    $('search').addEventListener('input',render);$('refresh').addEventListener('click',load);$('close-detail').addEventListener('click',()=>$('detail-overlay').classList.add('hidden'));$('detail-overlay').addEventListener('click',event=>{if(event.target===$('detail-overlay'))$('detail-overlay').classList.add('hidden');});$('approve-menu').addEventListener('click',()=>review('approved'));$('request-changes').addEventListener('click',()=>review('changes_requested'));
    await load();
  </script>
</body>
</html>
