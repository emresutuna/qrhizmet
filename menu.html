      fr:{welcome:'BIENVENUE',title:'Découvrez notre menu',copy:'Choisissez une catégorie pour commencer.',choose:'Choisir une catégorie',all:'Tout',recommend:'Suggérer un plat',recommendCopy:'Choisissez votre envie et nous trouverons une suggestion.',menu:'Notre menu',search:'Rechercher…',empty:'Aucun produit dans cette catégorie.',close:'Fermer',back:'Retour au menu',chooseKind:'Que souhaitez-vous ?',meal:'Plat',sweet:'Dessert',drink:'Boisson',suggest:'Suggérer',noSuggestion:'Pas encore de produit dans cette catégorie. Voici une alternative proche.',language:'Langue du menu'},
      es:{welcome:'BIENVENIDO',title:'Descubre nuestro menú',copy:'Elige una categoría para empezar.',choose:'Elige una categoría',all:'Todo',recommend:'Recomiéndame algo',recommendCopy:'Elige lo que te apetece y encontraremos una opción.',menu:'Nuestro menú',search:'Buscar…',empty:'No hay productos en esta categoría.',close:'Cerrar',back:'Volver al menú',chooseKind:'¿Qué te apetece?',meal:'Comida',sweet:'Postre',drink:'Bebida',suggest:'Recomendar',noSuggestion:'Aún no hay productos de esta categoría. Encontramos una opción parecida.',language:'Idioma del menú'}
    };
    const languageLabels = { tr:'Türkçe', en:'English', de:'Deutsch', ar:'العربية', ru:'Русский', fr:'Français', es:'Español' };
    let state, baseState, availableLanguages=['tr'], language='tr', category='all', recommendationKind='meal', campaignIndex=0, campaignTimer;
    try { state=JSON.parse(localStorage.getItem(KEY)); } catch {}
    const params = new URLSearchParams(location.search);
    const menuId = params.get('menu');
    if(menuId){const canonical=new URL('menu.html',location.origin);canonical.searchParams.set('menu',menuId);document.querySelector('link[rel=canonical]').href=canonical.href;}
    if (menuId) {
      try {
        const response=await fetch('/.netlify/functions/menus?id='+encodeURIComponent(menuId));
        if(response.ok){const result=await response.json();state=result.data;availableLanguages=['tr',...(result.languages||[])];}

    const browserLanguage=(navigator.language||'tr').split('-')[0].toLowerCase();

    let activeTranslation=null;
    if(menuId&&language!=='tr'){
      try{const response=await fetch('/.netlify/functions/menus?id='+encodeURIComponent(menuId)+'&lang='+encodeURIComponent(language));if(response.ok)activeTranslation=(await response.json()).translation;}catch{}

    if(!state||!state.brand||!Array.isArray(state.products)||!state.products.length||!menuId||state.menuId!==menuId){
      document.title='Menü açılamadı — QRHizmeti';$('brand-name').textContent='Menü bulunamadı';$('brand-intro').textContent='Bu menü bağlantısı bulunamadı. QR adresini kontrol edip işletmeyle iletişime geçin.';$('welcome-categories').remove();$('campaign-wrap').remove();$('category-list').remove();$('recommend-button').remove();$('products').innerHTML='<p class="rounded-2xl bg-white p-5 text-sm leading-6 text-muted">Menü bulunamadı veya henüz yayımlanmamış. QR adresini kontrol edip işletmeyle iletişime geçin.</p>';return;
    }
    baseState=structuredClone(state);
    function translatedState(source,translation){
      const copy=structuredClone(source);if(!translation)return copy;
      copy.brand={...copy.brand,...translation.brand};copy.categories=translation.categories||copy.categories;

      copy.products=copy.products.map(item=>({...item,...(byId.get(item.id)||{})}));return copy;
    }
    state=translatedState(baseState,activeTranslation);
    function t(key){return (dictionaries[language]||dictionaries.tr)[key]||dictionaries.tr[key]||key;}
    function metric(type,extra={}){if(!menuId)return;fetch('/.netlify/functions/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:menuId,type,language,...extra})}).catch(()=>{});}
    function setTexts(){const strings={welcome:$('welcome-kicker'),title:$('welcome-title'),copy:$('welcome-copy'),recommend:$('recommend-title'),recommendCopy:$('recommend-copy'),menu:$('menu-title'),empty:$('empty'),choose:$('category-heading')};Object.entries(strings).forEach(([key,node])=>{if(node)node.textContent=t(key);});$('search').placeholder=t('search');$('language-select').setAttribute('aria-label',t('language'));$('recommend-result').textContent=t('suggest')+' ↗';$('detail-close').textContent=t('close');$('recommend-close').setAttribute('aria-label',t('close'));$('recommend-kind-title').textContent=t('chooseKind');document.querySelectorAll('[data-kind]').forEach(button=>{const key=button.dataset.kind==='Yemek'?'meal':button.dataset.kind==='Tatlı'?'sweet':'drink';button.querySelector('span')?.remove();button.textContent=t(key);});document.querySelectorAll('.category').forEach(button=>{if(button.dataset.category==='all')button.textContent=t('all');});}
    function selectMenuLanguage(lang){language=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';state=translatedState(baseState,activeTranslation);setTexts();renderAll();const url=new URL(location.href);if(lang==='tr')url.searchParams.delete('lang');else url.searchParams.set('lang',lang);history.replaceState({},'',url);}
    const businessType=baseState.brand.type||'restaurant';const sectorName=businessType==='barber'?'Kuaför':businessType==='carwash'?'Oto yıkama':businessType==='other'?'İşletme':'Restoran';const catalogName=businessType==='barber'?'Hizmetler':businessType==='carwash'?'Yıkama paketleri':businessType==='other'?'Ürün ve hizmetler':'Menümüz';document.title=(baseState.brand.name||sectorName)+' — QRHizmeti';document.querySelector('meta[name=description]').content=(baseState.brand.name||sectorName)+' QR sayfası: ürün ve hizmet bilgileri, fiyatlar ve kampanyalar.';
    function renderHeader(){const brand=state.brand;$('brand-name').textContent=brand.name||'İşletme';$('brand-intro').textContent=brand.intro||'QR sayfamıza hoş geldiniz.';$('menu-kicker').textContent=brand.name||sectorName.toLocaleUpperCase(language);$('menu-title').textContent=catalogName;$('welcome-title').textContent=businessType==='restaurant'?t('title'):language==='tr'?(businessType==='barber'?'Hizmetlerimizi keşfedin':businessType==='carwash'?'Yıkama paketlerimizi keşfedin':'Ürün ve hizmetlerimizi keşfedin'):catalogName;$('welcome-copy').textContent=language==='tr'?(businessType==='barber'?'İhtiyacınıza uygun hizmeti seçerek başlayın.':businessType==='carwash'?'Aracınıza uygun yıkama paketini seçin.':'Size uygun bir kategori seçerek başlayın.'):t('copy');$('recommend-button').classList.toggle('hidden',businessType!=='restaurant');$('category-heading').textContent=language==='tr'?(businessType==='barber'?'Hizmet kategorileri':businessType==='carwash'?'Paket kategorileri':'Kategoriler'):t('choose');$('search').placeholder=language==='tr'?(businessType==='barber'?'Hizmet ara…':businessType==='carwash'?'Paket ara…':'Ürün ara…'):t('search');if(brand.logo){const img=new Image();img.src=brand.logo;img.alt=(brand.name||'')+' logosu';img.className='h-full w-full object-cover';$('brand-logo').replaceChildren(img);}else $('brand-logo').textContent=(brand.name||'QR').slice(0,2).toLocaleUpperCase(language);const select=$('language-select');select.replaceChildren();availableLanguages.forEach(lang=>{const option=document.createElement('option');option.value=lang;option.textContent=languageLabels[lang]||lang.toUpperCase();select.append(option);});select.value=language;}
    function renderWelcomeCategories(){const target=$('welcome-categories');target.replaceChildren();state.categories.forEach(categoryName=>{const items=state.products.filter(product=>product.category===categoryName);if(!items.length)return;const tile=document.createElement('button');tile.type='button';tile.className='category-tile';const photo=items.find(product=>product.photo)?.photo;if(photo){const img=new Image();img.src=photo;img.alt='';tile.append(img);}const copy=document.createElement('span');copy.className='category-tile-copy';copy.append(textNode('b','block text-sm font-extrabold',categoryName),textNode('small','mt-1 block text-[9px] font-bold text-white/80',items.length+' '+(language==='tr'?'ÜRÜN':'ITEMS')));tile.append(copy);tile.addEventListener('click',()=>{category=categoryName;renderCategories();renderProducts();metric('category_view',{category:categoryName});$('products-heading').scrollIntoView({behavior:'smooth',block:'start'});});target.append(tile);});}
    function textNode(tag,className,text){const node=document.createElement(tag);node.className=className;node.textContent=text;return node;}
    function renderCategories(){const wrap=$('category-list');wrap.replaceChildren();const all=document.createElement('button');all.className='category'+(category==='all'?' active':'');all.dataset.category='all';all.textContent=t('all');all.onclick=()=>{category='all';renderCategories();renderProducts();};wrap.append(all);state.categories.forEach(name=>{const button=document.createElement('button');button.className='category'+(category===name?' active':'');button.dataset.category=name;button.textContent=name;button.onclick=()=>{category=name;renderCategories();renderProducts();metric('category_view',{category:name});};wrap.append(button);});}
    function renderAll(){renderHeader();renderWelcomeCategories();renderCategories();renderProducts();setTexts();}
    function openDetail(product){$('detail-name').textContent=product.name;$('detail-price').textContent='₺'+(product.discountPercent?Number(product.price*(100-product.discountPercent)/100).toFixed(2):product.price);$('detail-description').textContent=product.description||'İçerik bilgisi için işletmeye danışın.';const photo=$('detail-photo');photo.replaceChildren();if(product.photo){const image=new Image();image.src=product.photo;image.alt=product.name;image.className='h-full w-full object-cover';photo.append(image);}const badges=$('detail-badges');badges.replaceChildren();[[product.weight&&product.weight+' g'],[product.calories&&product.calories+' kcal'],[product.allergens]].filter(item=>item[0]).forEach(([label])=>badges.append(textNode('span','',label)));$('detail-modal').classList.remove('hidden');$('detail-modal').classList.add('flex');metric('product_open',{productId:product.id,productName:product.name,category:product.category});}
    function renderProducts(){const query=$('search').value.trim().toLocaleLowerCase(language),wrap=$('products');wrap.replaceChildren();const items=state.products.filter(product=>(category==='all'||product.category===category)&&(!query||[product.name,product.description,product.category].join(' ').toLocaleLowerCase(language).includes(query)));$('empty').textContent=businessType==='barber'?'Bu kategoride hizmet bulunamadı.':businessType==='carwash'?'Bu kategoride paket bulunamadı.':'Bu kategoride ürün bulunamadı.';$('empty').classList.toggle('hidden',items.length>0);items.forEach(product=>{const button=document.createElement('button');button.className='food-card';const photo=document.createElement('span');photo.className='food-photo';if(product.photo){const image=new Image();image.src=product.photo;image.alt=product.name;photo.append(image);}else photo.classList.add('bg-gradient-to-br','from-teal/15','to-ink/10');const copy=document.createElement('span');copy.className='min-w-0 flex-1 text-left text-xs';const top=document.createElement('span');top.className='flex justify-between gap-2';const name=document.createElement('b');name.textContent=product.name;const price=document.createElement('b');price.textContent='₺'+(product.discountPercent?Number(product.price*(100-product.discountPercent)/100).toFixed(2):product.price);top.append(name,price);copy.append(top);if(product.discountPercent){const old=document.createElement('del');old.className='ml-2 text-[10px] text-muted';old.textContent='₺'+product.price;top.append(old);}const description=document.createElement('span');description.className='mt-1 block text-[10px] leading-4 text-muted';description.textContent=product.description||'Detaylar için ürüne dokun.';copy.append(description);const badges=document.createElement('span');badges.className='badges';[[product.weight&&product.weight+' g'],[product.calories&&product.calories+' kcal'],[product.allergens]].filter(item=>item[0]).forEach(([label])=>badges.append(textNode('span','',label)));copy.append(badges);button.append(photo,copy);button.onclick=()=>openDetail(product);wrap.append(button);});}
    function sourceCategory(product){const original=baseState.products.find(item=>item.id===product.id)||product;return String(original.category||'').toLocaleLowerCase('tr');}
    function recommend(kind){const matches=state.products.filter(product=>{const value=sourceCategory(product);if(kind==='Tatlı')return value.includes('tatlı')||value.includes('tatli');if(kind==='İçecek')return value.includes('içecek')||value.includes('icecek');return !value.includes('tatlı')&&!value.includes('tatli')&&!value.includes('içecek')&&!value.includes('icecek');});const choices=matches.length?matches:state.products;return choices.length?choices[Math.floor(Math.random()*choices.length)]:null;}
    function showRecommendation(){const product=recommend(recommendationKind),target=$('recommendation');target.replaceChildren();if(!product){target.append(textNode('p','rounded-xl bg-paper p-4 text-xs text-muted',language==='tr'?'Menüye henüz bu türde ürün eklenmemiş.':'No item of this type has been added yet.'));return;}const card=document.createElement('button');card.type='button';card.className='food-card';card.append(textNode('span','flex-1 text-left text-sm font-extrabold',product.name),textNode('b','text-sm','₺'+product.price));card.onclick=()=>{$('recommend-close').click();openDetail(product);};target.append(card);}
    function renderCampaign(){clearInterval(campaignTimer);const campaigns=state.campaigns||[],wrap=$('campaign-wrap');wrap.classList.toggle('hidden',!campaigns.length);if(!campaigns.length)return;campaignIndex%=campaigns.length;$('campaign-image').src=campaigns[campaignIndex].image;$('campaign-image').alt='Kampanya '+(campaignIndex+1);const multi=campaigns.length>1;$('campaign-prev').classList.toggle('hidden',!multi);$('campaign-next').classList.toggle('hidden',!multi);const dots=$('campaign-dots');dots.replaceChildren();if(multi){campaigns.forEach((_,index)=>{const dot=document.createElement('button');dot.type='button';dot.className='h-1.5 rounded-full '+(index===campaignIndex?'w-4 bg-white':'w-1.5 bg-white/60');dot.setAttribute('aria-label','Kampanya '+(index+1));dot.onclick=()=>{campaignIndex=index;renderCampaign();};dots.append(dot);});campaignTimer=setInterval(()=>{campaignIndex=(campaignIndex+1)%campaigns.length;renderCampaign();},4000);}}
    function moveCampaign(direction){campaignIndex=(campaignIndex+direction+(state.campaigns||[]).length)%(state.campaigns||[]).length;renderCampaign();}
    $('campaign-prev').onclick=()=>moveCampaign(-1);$('campaign-next').onclick=()=>moveCampaign(1);$('search').addEventListener('input',renderProducts);
    $('language-select').addEventListener('change',async event=>{const next=event.target.value;if(next==='tr'){activeTranslation=null;selectMenuLanguage('tr');}else{try{const response=await fetch('/.netlify/functions/menus?id='+encodeURIComponent(menuId)+'&lang='+encodeURIComponent(next));const result=await response.json();if(!response.ok||!result.translation)throw new Error('Bu dil için çeviri bulunamadı.');activeTranslation=result.translation;selectMenuLanguage(next);metric('language_select');}catch{$('language-select').value=language;}}});
    $('detail-close').onclick=()=>{$('detail-modal').classList.add('hidden');$('detail-modal').classList.remove('flex');};$('detail-modal').addEventListener('click',event=>{if(event.target===$('detail-modal'))$('detail-close').click();});$('recommend-close').onclick=()=>{$('recommend-modal').classList.add('hidden');$('recommend-modal').classList.remove('flex');};$('recommend-button').onclick=()=>{$('recommend-modal').classList.remove('hidden');$('recommend-modal').classList.add('flex');};document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{recommendationKind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(item=>item.classList.toggle('bg-teal/15',item===button));}));$('recommend-result').onclick=showRecommendation;
    $('detail-close').textContent=t('close');$('recommend-close').textContent='×';$('category-heading').textContent=t('choose');$('products-heading').scrollMarginTop='90px';
    document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';renderAll();renderCampaign();metric('menu_open');if(language!=='tr')metric('language_select');
  })();
  </script>
